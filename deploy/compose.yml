# Servicio del transporte HTTP remoto de hebra-mcp (`mcp.hebra.pro`, SPEC.md
# §12.5, lote C4).
#
# Se despliega en el VPS de Lumbre a partir de una copia de `dist/`,
# `package.json`, `package-lock.json` y `deploy/` subida por `rsync` (el
# servidor no clona `vendor/hebra`, el submódulo privado de Hebra) y se une a
# la red Docker externa `edge`, la misma que usa el Caddy compartido de
# `/srv/edge` para terminar TLS de todos los sitios del borde (Lumbre, Vega,
# fodaveg, demos...). Ver `deploy/README-deploy.md` para el procedimiento
# completo.
#
#   docker compose -f deploy/compose.yml up -d --build
#
# NO publica puertos al host A PROPÓSITO: Caddy lo alcanza por el DNS de la
# red `edge` con el nombre del contenedor (`hebra-mcp:8787`). Publicar 8787 en
# el host abriría un segundo camino de entrada, sin TLS ni cabeceras del
# borde, hacia un endpoint que acepta tokens OAuth.
#
# Nombres de variable confirmados contra `src/http/config.ts`, `src/secrets/`
# y `src/oauth/cli.ts` (rama `c2-c3-serve-http-oauth`, integrada aquí el 26
# sep 2026). Detalle de cada una en `README-deploy.md`.
name: hebra-mcp

services:
  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hebra-mcp:latest
    container_name: hebra-mcp
    restart: unless-stopped
    # Apagado ordenado (A1 del audit de robustez, 10 oct 2026): con SIGTERM,
    # `serve-http` espera hasta 8 s a las peticiones HTTP en curso, hasta 10 s a
    # la ronda de sync de una escritura y después vacía la cola y cierra la
    # SQLite; una ronda colgada en el relé tarda hasta ~30 s en soltarse. Con
    # los 10 s por defecto de Docker, el SIGKILL cortaba respuestas de
    # escrituras ya guardadas (y el reintento de un append lo duplicaba).
    stop_grace_period: 40s
    # ⚠️ NUNCA fijar `DEBUG` aquí (ni a mano con `docker compose run -e DEBUG=...`).
    # Express usa el paquete `debug` para sus trazas internas (`express:router`
    # y compañía) y, si se activa, vuelca `req.url` COMPLETO a stderr — que en
    # este proceso es justo la URI de `/oauth/authorize` con `client_id`,
    # `redirect_uri`, `code_challenge` y `state` en la query string (auditoría
    # de seguridad del 26 sep 2026). El log propio de la app (`src/log/logger.ts`,
    # `http.request`) ya cubre lo que hace falta sin citar la URI.
    environment:
      # `src/secrets/store-mode.ts`: selección EXPLÍCITA del almacén de
      # secretos, nunca un fallback silencioso (SPEC.md §12.3). Por defecto es
      # `keychain`; sin Secret Service en el contenedor, `@napi-rs/keyring`
      # caería en silencio a keyutils (no persiste tras reiniciar) si no se
      # fijara `file` aquí.
      HEBRA_MCP_SECRET_STORE: 'file'
      # `src/privacy/data-dir.ts`: el directorio de datos, con la SQLite,
      # `config.json` de privados, los secretos de fichero (C1, JSON 0600 en
      # subdirectorio 0700) y `oauth-revocations-v2.json`/`oauth-tokens.json`.
      HEBRA_MCP_DATA_DIR: /data
      # Se inyecta desde el entorno privado del operador; nunca se versiona su valor.
      HEBRA_MCP_BACKCHANNEL_SECRET: ${HEBRA_MCP_BACKCHANNEL_SECRET:?configura el secreto compartido con Lumbre}
      # `src/http/config.ts`. Por defecto `serve-http` escucha en `127.0.0.1`
      # (pensado para tests/desarrollo local): AQUÍ tiene que ser `0.0.0.0` o
      # Caddy no lo alcanzaría por la red `edge`. Repetido como `ENV` en el
      # `Dockerfile` como red de seguridad si algún día se arranca esta imagen
      # sin este `environment:`.
      HEBRA_MCP_HTTP_LISTEN: '0.0.0.0'
      HEBRA_MCP_HTTP_PORT: '8787'
      # `src/http/config.ts`: origen público, a la vez issuer OAuth y base del
      # recurso protegido (`<origen>/mcp`). Host elegido por David el 26 sep
      # 2026 (SPEC.md §12.5); ya resuelve al servidor, falta el sitio en Caddy
      # (`deploy/mcp-hebra-pro.caddy`).
      HEBRA_MCP_PUBLIC_URL: 'https://mcp.hebra.pro'
    volumes:
      - data:/data
    networks:
      - edge
    # Endurecido porque este contenedor termina aceptando bearers OAuth de
    # Internet (a través del borde): sin escritura en el resto del sistema de
    # ficheros, sin capacidades Linux, sin escalada de privilegios. Si algo
    # de esto rompe el arranque real (medible solo tras integrar C1-C3), se
    # ajusta aquí con el motivo medido, no se quita a ciegas.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --spider http://127.0.0.1:8787/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  data:

networks:
  edge:
    external: true
    name: edge
